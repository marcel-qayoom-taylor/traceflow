<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="traceflow-token" content="__TRACEFLOW_TOKEN__">
  <title>Traceflow</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <strong>Traceflow</strong>
      <span>sequence debugger</span>
    </div>
    <div class="transport" id="transport"></div>
    <div class="settings">
      <button type="button" id="settings-toggle" class="settings-toggle" aria-label="Settings" title="Settings" aria-expanded="false" aria-controls="settings-panel">⚙️</button>
      <div id="settings-panel" class="settings-panel" role="dialog" aria-label="Traceflow settings" hidden></div>
    </div>
  </header>
  <main>
    <aside class="rail">
      <section>
        <div class="section-title">
          <span>Services</span>
          <button type="button" id="scan" class="text">Scan</button>
        </div>
        <div id="services"></div>
      </section>
      <section class="grow">
        <div class="section-title">
          <span>Traces</span>
          <button type="button" id="clear" class="text">Clear</button>
        </div>
        <div class="trace-search"><input id="trace-search" type="search" placeholder="Filter traces (regex)" title="Search method, path, and services. Regular expressions are supported."></div>
        <div id="traces"></div>
      </section>
    </aside>
    <section class="stage">
      <div id="held" class="held"></div>
      <div id="diagram" class="diagram"></div>
    </section>
    <div
      id="inspector-resizer"
      class="inspector-resizer"
      role="separator"
      aria-label="Resize inspector panel"
      aria-orientation="vertical"
      aria-valuemin="240"
      aria-valuenow="340"
      tabindex="0"
    ></div>
    <aside class="inspector" id="inspector"></aside>
  </main>
  <div
    id="log-resizer"
    class="log-resizer"
    role="separator"
    aria-label="Resize log panel"
    aria-orientation="horizontal"
    aria-valuemin="96"
    aria-valuenow="168"
    tabindex="0"
  ></div>
  <footer class="logs">
    <div class="log-header">
      <button type="button" id="log-title" class="text" title="Show all service logs">All logs</button>
      <button type="button" id="clear-logs" class="text" title="Clear captured logs">Clear logs</button>
    </div>
    <pre id="log-view"></pre>
  </footer>
  <script src="/app.js"></script>
</body>
</html>
